databases:
  - name: methadone-annotation-db
    plan: free
    databaseName: methadone_annotation
    user: methadone_user

services:
  - type: web
    name: methadone-annotation-app
    runtime: python
    rootDir: methadone_app
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --timeout 120
    envVars:
      - key: PYTHON_VERSION
        value: "3.11"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: methadone-annotation-db
          property: connectionString
