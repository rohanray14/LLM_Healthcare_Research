services:
  - type: web
    name: annotation-tool
    runtime: python
    rootDir: annotation_tool
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --timeout 120
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.0"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: annotation-tool-db
          property: connectionString

databases:
  - name: annotation-tool-db
    plan: free
