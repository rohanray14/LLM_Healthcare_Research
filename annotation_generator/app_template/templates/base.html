<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Annotation Tool{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="{{ url_for('static', filename='style.css') }}" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-dark bg-dark px-3">
        {% if project is defined and project %}
        <a class="navbar-brand" href="{{ url_for('project_dashboard', slug=project.slug) }}">{{ project.name }}</a>
        {% else %}
        <a class="navbar-brand" href="{{ url_for('home') }}">Annotation Tool</a>
        {% endif %}
        {% if current_user %}
        <div class="d-flex align-items-center gap-3">
            {% if project is defined and project %}
            <a href="{{ url_for('home') }}" class="btn btn-sm btn-outline-light">My Projects</a>
            {% endif %}
            <span class="text-light">{{ current_user.username }}</span>
            <a href="{{ url_for('logout') }}" class="btn btn-sm btn-outline-light">Logout</a>
        </div>
        {% endif %}
    </nav>
    <div class="container-fluid px-4 py-3">
        {% block content %}{% endblock %}
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
