databases:
  - name: annotation-db
    plan: free

services:
  - type: web
    name: annotation-tool
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: annotation-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
